function text(s, x, y, col, sc, align) {
  s = String(s).toUpperCase(); sc = sc || 1; const adv = 7 * sc;
  const w = s.length * adv - sc;
  if (align === 'c') x -= w / 2; else if (align === 'r') x -= w;
  ctx.fillStyle = col;
  for (let i = 0; i < s.length; i++) {
    const g = FONT[s[i]]; if (!g) continue;
    for (let r = 0; r < 7; r++) for (let c = 0; c < 5; c++)
      if (g[r] & (16 >> c)) ctx.fillRect(Math.round(x + i * adv + c * sc), Math.round(y + r * sc), sc, sc);
  }
}

}

// ---------- 4. audio ----------
let AC = null, muted = false;
function initAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f0, f1, dur, type, vol, delay) {
  if (!AC || muted) return;
  const t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol || 0.1, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.03);
}
function noise(dur, vol, f0, f1, delay) {
  if (!AC || muted) return;
  const t = AC.currentTime + (delay || 0), n = Math.floor(AC.sampleRate * dur);
  const b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = AC.createBufferSource(); s.buffer = b;
  const f = AC.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t);
}

function addScore(n) {

// ---------- 6. paths ----------
// Catmull-Rom spline through points, resampled at 1px spacing -> constant speed.
function makePath(pts) {
  const dense = [], n = pts.length;
  for (let i = 0; i < n - 1; i++) {
    const p0 = pts[Math.max(i - 1, 0)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(i + 2, n - 1)];
    for (let s = 0; s < 16; s++) {
      const t = s / 16, t2 = t * t, t3 = t2 * t, q = [0, 0];
      for (let a = 0; a < 2; a++)
        q[a] = 0.5 * (2 * p1[a] + (-p0[a] + p2[a]) * t + (2 * p0[a] - 5 * p1[a] + 4 * p2[a] - p3[a]) * t2 + (-p0[a] + 3 * p1[a] - 3 * p2[a] + p3[a]) * t3);
      dense.push(q);
    }
  }
  dense.push(pts[n - 1].slice());
  const out = [dense[0].slice()]; let cur = dense[0].slice(), k = 1, rem = 1;
  while (k < dense.length) {
    const nx = dense[k], dx = nx[0] - cur[0], dy = nx[1] - cur[1], dl = Math.hypot(dx, dy);
    if (dl >= rem) { cur = [cur[0] + dx / dl * rem, cur[1] + dy / dl * rem]; out.push(cur); rem = 1; }
    else { rem -= dl; cur = nx.slice(); k++; }
  }
  out.push(cur.slice());
  return out;
}
// Move enemy along its path; returns true when the end is reached.
function advance(e, spd) {
  e.d += spd; const p = e.path, L = p.length - 1;
  const done = e.d >= L - 1, d = Math.min(e.d, L - 1.001), i = d | 0, f = d - i;
  e.x = p[i][0] + (p[i + 1][0] - p[i][0]) * f; e.y = p[i][1] + (p[i + 1][1] - p[i][1]) * f;
  const q = p[Math.min(i + 3, L)], dx = q[0] - p[i][0], dy = q[1] - p[i][1];
  if (Math.hypot(dx, dy) > 0.01) e.ang = Math.atan2(dy, dx) - Math.PI / 2;
  return done;
}
