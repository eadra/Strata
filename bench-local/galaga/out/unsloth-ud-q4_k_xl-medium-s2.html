<!DOCTYPE html>

<head>
<meta charset="utf-8">
<title>GALAGA</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{background:#000;image-rendering:pixelated;image-rendering:crisp-edges}
</style>

<body>
<div id="wrap"><canvas id="c" width="224" height="288"></canvas></div>
<script>
'use strict';
/* =========================================================================
   GALAGA (browser clone) - single file, no external resources.
   Sections: setup, audio, sprites, helpers, state, input, game flow,
             update logic, rendering, main loop.
   ========================================================================= */

/* ------------------------------- setup -------------------------------- */
const W = 224, H = 288;                       // arcade resolution (3:4)
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
function resize(){
  const s = Math.max(1, Math.floor(Math.min(innerWidth / W, innerHeight / H)));
  cv.style.width  = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
}
addEventListener('resize', resize); resize();

/* ------------------------------- audio -------------------------------- */
let AC = null, master = null, noiseBuf = null, muted = false;
function initAudio(){
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : 0.22;
    master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch(e){ AC = null; }
}
function tone(f0, f1, dur, type, vol, when){
  if (!AC) return;
  const t = AC.currentTime + (when || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(Math.max(1, f0), t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, f0, f1, when){
  if (!AC) return;
  const t = AC.currentTime + (when || 0);
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const flt = AC.createBiquadFilter(); flt.type = 'bandpass';
  flt.frequency.setValueAtTime(f0, t);
  flt.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(flt); flt.connect(g); g.connect(master);
  s.start(t); s.stop(t + dur + 0.02);
}
function sfx(name){
  if (!AC) return;
  switch(name){
    case 'shot':      tone(1050, 220, 0.09, 'square', 0.35); break;
    case 'enemyDie':  noise(0.22, 0.9, 2600, 150); tone(300, 60, 0.2, 'triangle', 0.3); break;
    case 'bossHit':   noise(0.14, 0.9, 900, 200); tone(180, 90, 0.14, 'square', 0.3); break;
    case 'playerDie': noise(0.7, 1.0, 1800, 60); tone(320, 30, 0.7, 'sawtooth', 0.5);
                      noise(0.5, 0.6, 500, 40, 0.1); break;
    case 'beam':      tone(120, 420, 0.17, 'sawtooth', 0.14); break;
    case 'dock':      tone(520, 1040, 0.25, 'square', 0.3); break;
    case 'extra':     tone(660, 660, 0.1, 'square', 0.3); tone(880, 880, 0.15, 'square', 0.3, 0.1); break;
    case 'jingle': {  // short stage-start fanfare
      const n = [523, 523, 523, 392, 523, 659, 587, 523];
      const d = [0, .1, .2, .3, .45, .6, .78, .95];
      for (let i = 0; i < n.length; i++) tone(n[i], n[i], 0.11, 'square', 0.28, d[i]);
      break; }
  }
}
function toggleMute(){ muted = !muted; if (master) master.gain.value = muted ? 0 : 0.22; }

/* ------------------------------ sprites ------------------------------- */
/* Pixel-art sprites as string rows; each char maps to a palette colour. */
const SPR = {
  player: [[
    "......W......",
    "......W......",
    ".....WWW.....",
    ".....WRW.....",
    "W....WRW....W",
    "WW...WRW...WW",
    ".WWWRRRRRWWW.",
    "..WRRRRRRRW..",
    "...RRRRRRR...",
    "..BBRRRRRBB..",
    ".B..B.R.B..B.",
    "B...B.R.B...B"
  ]],
  zako: [
    [ "..B.....B..",
      "..BB...BB..",
      ".BBBB.BBBB.",
      ".BBYYYYYBB.",
      "YYBYYYYYBYY",
      "YY.YYYYY.YY",
      "...YYYYY...",
      "....YYY....",
      ".....Y....." ],
    [ ".....Y.....",
      "....YYY....",
      "...YYYYY...",
      "YY.YYYYY.YY",
      "YYBYYYYYBYY",
      ".BBYYYYYBB.",
      ".BBBB.BBBB.",
      "..BB...BB..",
      "..B.....B.." ]
  ],
  goei: [
    [ "RR.........RR",
      "RRR.......RRR",
      "RRRR.....RRRR",
      ".RRRR.R.RRRR.",
      ".RRRRRRRRRRR.",
      "..RRRRWRRRR..",
      "...RRRRRRR...",
      "..RR.RRR.RR..",
      ".R...RRR...R.",
      ".....RRR....." ],
    [ ".....RRR.....",
      "....RRRRR....",
      "...RRRRRRR...",
      "..RRRRRRRRR..",
      ".RRRRRWRRRRR.",
      ".RRRRRRRRRRR.",
      ".RRRRRRRRRRR.",
      "..RRRRRRRRR..",
      "...RR.R.RR...",
      ".....RRR....." ]
  ],
  boss: [
    [ "G.....G.....G",
      "GG...GGG...GG",
      ".GG.GGGGG.GG.",
      "..GGGGGGGGG..",
      ".GGGYGGGYGGG.",
      ".GGGGGGGGGGG.",
      "GGGGGGWGGGGGG",
      "GG.GGGGGGG.GG",
      "G..GGGGGGG..G",
      "...GG.G.GG...",
      "....GGGGG....",
      ".....GGG....." ],
    [ ".G...G.G...G.",
      "..G.GGG.G..G.",
      ".GG.GGGGG.GG.",
      "..GGGGGGGGG..",
      ".GGGYGGGYGGG.",
      ".GGGGGGGGGGG.",
      "GGGGGGWGGGGGG",
      "GG.GGGGGGG.GG",
      "G..GGGGGGG..G",
      "...GG.G.GG...",
      "....GGGGG....",
      ".....GGG....." ]
  ]
};
const PAL = {
  player:   { W:'#ffffff', R:'#ff2828', B:'#3858ff' },
  captured: { W:'#ff5050', R:'#e00000', B:'#ff3030' },
  zako:     { B:'#3868ff', Y:'#ffe020' },
  goei:     { R:'#ff3838', W:'#ffffff' },
  boss:     { G:'#28d028', W:'#ffffff', Y:'#ffff00' },
  bossHit:  { G:'#4848ff', W:'#ffffff', Y:'#ffff00' }
};
function drawSpr(rows, cx, cy, pal){
  const h = rows.length, w = rows[0].length;
  const x0 = Math.round(cx - w / 2), y0 = Math.round(cy - h / 2);
  for (let r = 0; r < h; r++){
    const line = rows[r];
    for (let c = 0; c < w; c++){
      const col = pal[line[c]];
      if (col){ ctx.fillStyle = col; ctx.fillRect(x0 + c, y0 + r, 1, 1); }
    }
  }
}

/* ------------------------------ helpers ------------------------------- */
const rnd  = (a, b) => a + Math.random() * (b - a);
const irnd = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function catmull(pts, u){
  const n = pts.length - 1;
  let s = clamp(u, 0, 0.999999) * n, i = Math.floor(s), t = s - i;
  const p0 = pts[Math.max(0, i - 1)], p1 = pts[i],
        p2 = pts[Math.min(n, i + 1)], p3 = pts[Math.min(n, i + 2)];
  const t2 = t * t, t3 = t2 * t;
  const f = (a, b, c, d) =>
    0.5 * ((2 * b) + (c - a) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (3 * a - 3 * c + d - b) * t3);
  return { x: f(p0.x, p1.x, p2.x, p3.x), y: f(p0.y, p1.y, p2.y, p3.y) };
}
function overlap(ax, ay, aw, ah, bx, by, bw, bh){
  return Math.abs(ax - bx) * 2 < aw + bw && Math.abs(ay - by) * 2 < ah + bh;
}
function T(str, x, y, col, sz, al){
  ctx.fillStyle = col || '#ffffff';
  ctx.font = 'bold ' + (sz || 8) + 'px monospace';
  ctx.textAlign = al || 'left';
  ctx.textBaseline = 'top';
  ctx.fillText(str, x, y);
}

/* ------------------------------- state -------------------------------- */
const game = {
  mode:'attract', t:0, paused:false, timer:0, msg:'',
  stage:1, score:0, hi:parseInt(localStorage.getItem('galagaHi') || '0', 10) || 0,
  nextExtra:20000, breathMix:0, diveTimer:3, diveAllow:0,
  shotsFired:0, shotsHit:0,
  challenge:null, captureBoss:null, captureT:0, captureFrom:null
};
const player = { x:112, alive:false, dual:false, lives:2, invuln:0 };
let enemies = [], pBullets = [], eBullets = [], explosions = [], freedShips = [];

/* entry-path groups: [startDelay, waypoints, enemies(startIdx, count)] */
const ENTRY = [
  { d:0.0,  path:[{x:-40,y:100},{x:30,y:20},{x:112,y:-5},{x:190,y:30},{x:215,y:85}], idx:[0,4] },
  { d:1.6,  path:[{x:262,y:300},{x:225,y:200},{x:150,y:150},{x:70,y:170},{x:30,y:120}], idx:[4,8] },
  { d:3.2,  path:[{x:-40,y:-20},{x:40,y:60},{x:120,y:110},{x:190,y:80},{x:212,y:130}], idx:[12,8] },
  { d:4.8,  path:[{x:270,y:-10},{x:180,y:60},{x:90,y:30},{x:20,y:90},{x:55,y:150}], idx:[20,10] },
  { d:6.4,  path:[{x:-46,y:290},{x:20,y:220},{x:110,y:250},{x:190,y:200},{x:215,y:150}], idx:[30,10] }
];

/* starfield */
const stars = [];
{
  const cols = ['#ffffff','#9bdfff','#fff0a0','#ffb0b0','#b0ffb0'];
  for (let i = 0; i < 70; i++)
    stars.push({ x:rnd(0,W), y:rnd(0,H), v:rnd(6,42), c:cols[irnd(0,4)], ph:rnd(0,6.3) });
}

/* ------------------------------- input -------------------------------- */
const keys = { l:false, r:false };
addEventListener('keydown', e => {
  initAudio();
  if ([' ', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault();
  if (e.repeat) return;
  switch (e.key){
    case 'ArrowLeft': case 'a': case 'A': keys.l = true; break;
    case 'ArrowRight': case 'd': case 'D': keys.r = true; break;
    case ' ': tryFire(); break;
    case 'Enter': onEnter(); break;
    case 'p': case 'P':
      if (game.mode === 'play' || game.mode === 'challenge') game.paused = !game.paused;
      break;
    case 'm': case 'M': toggleMute(); break;
  }
});
addEventListener('keyup', e => {
  switch (e.key){
    case 'ArrowLeft': case 'a': case 'A': keys.l = false; break;
    case 'ArrowRight': case 'd': case 'D': keys.r = false; break;
  }
});

function onEnter(){
  if (game.mode === 'attract') startGame();
  else if (game.mode === 'results') game.mode = 'attract';
}
function tryFire(){
  if (game.mode !== 'play' || !player.alive || game.paused) return;
  if (player.dual){
    if (pBullets.length === 0){
      pBullets.push({ x:player.x - 6, y:228 });
      pBullets.push({ x:player.x + 6, y:228 });
      game.shotsFired += 2; sfx('shot');
    }
  } else if (pBullets.length < 2){
    pBullets.push({ x:player.x, y:228 });
    game.shotsFired++; sfx('shot');
  }
}

/* ---------------------------- game flow ------------------------------- */
function addScore(p){
  game.score += p;
  if (game.score > game.hi){ game.hi = game.score; localStorage.setItem('galagaHi', String(game.hi)); }
  while (game.score >= game.nextExtra){
    game.nextExtra += 70000; player.lives++; sfx('extra');
  }
}
function startGame(){
  game.score = 0; game.stage = 1; game.nextExtra = 20000;
  game.shotsFired = 0; game.shotsHit = 0;
  player.lives = 2;
  beginStage();
}
function beginStage(){
  enemies = []; pBullets = []; eBullets = []; explosions = []; freedShips = [];
  game.breathMix = 0; game.diveTimer = 3;
  game.challenge = null; game.captureBoss = null;
  player.x = 112; player.dual = false; player.alive = true; player.invuln = 1.2;
  if (isChallenge(game.stage)){
    game.challenge = { wave:-1, waveTimer:0.5, spawned:0, hits:0, waves:[], bonus:0, done:false };
  } else {
    buildFormation();
  }
  game.mode = 'stageIntro'; game.timer = 2.0;
  sfx('jingle');
}
function isChallenge(s){ return s === 3 || (s - 3) % 4 === 0; }
function beginEntry(){
  for (const g of ENTRY)
    for (let i = g.idx[0]; i < g.idx[0] + g.idx[1]; i++){
      const e = enemies[i];
      e.state = 'wait';
      e.path = g.path;
      e.startTime = game.t + g.d + (i - g.idx[0]) * 0.16;
    }
  game.diveAllow = game.t + 2.5;
  game.mode = 'play';
}
/* standard 40-enemy formation: 4 boss / 16 goei / 20 zako */
function buildFormation(){
  const slot = (row, i, n) => ({ x:112 + (i - (n - 1) / 2) * (row < 1 ? 24 : 16), y:40 + row * 16 });
  let id = 0;
  for (let i = 0; i < 4; i++){ const p = slot(0, i, 4);   enemies.push(mkEnemy(id++, 'boss', p.x, p.y, 0)); }
  for (let r = 0; r < 2; r++) for (let i = 0; i < 8; i++){ const p = slot(1 + r, i, 8); enemies.push(mkEnemy(id++, 'goei', p.x, p.y, 1 + r)); }
  for (let r = 0; r < 2; r++) for (let i = 0; i < 10; i++){ const p = slot(3 + r, i, 10); enemies.push(mkEnemy(id++, 'zako', p.x, p.y, 3 + r)); }
}
function mkEnemy(id, type, bx, by, row){
  return { id, type, row, baseX:bx, baseY:by, x:bx, y:by, state:'wait',
           hp:type === 'boss' ? 2 : 1, u:0, path:null, from:null, k:0,
           divePath:null, retPath:null, beamT:0, beepT:0, captive:false,
           escortOf:null, shootT:rnd(0.5, 2.5) };
}
function slotPos(e){
  const cx = 112, cy = 72;
  const breath = 1 + Math.sin(game.t * 0.9) * 0.07 * game.breathMix;
  const swayAmp = 3 + 9 * (1 - game.breathMix);
  const sway = Math.sin(game.t * 0.45) * swayAmp;
  return { x: clamp(cx + (e.baseX - cx) * breath + sway, 12, 212),
           y: cy + (e.baseY - cy) * breath };
}

/* ------------------------- spawning / diving -------------------------- */
function startDive(){
  const form = enemies.filter(e => e.state === 'form');
  if (!form.length) return;
  const divers = enemies.filter(e => e.state === 'dive' || e.state === 'beam').length;
  if (divers >= Math.min(2 + Math.floor(game.stage / 2), 8)) return;
  const maxY = Math.max(...form.map(e => e.baseY));
  const cands = form.filter(e => e.baseY >= maxY - 16);      // bottom two rows first
  const e = (Math.random() < 0.75 && cands.length) ? cands[irnd(0, cands.length - 1)]
                                                   : form[irnd(0, form.length - 1)];
  launchDive(e);
}
function launchDive(e){
  const p0 = { x:e.x, y:e.y };
  if (e.type === 'boss' && !e.captive && game.stage >= 2 && Math.random() < 0.35){
    /* tractor-beam dive: boss stops mid-screen */
    const tx = clamp(player.x, 34, 190);
    e.divePath = [p0, { x:p0.x + rnd(-40, 40), y:p0.y + 40 }, { x:tx, y:80 }, { x:tx, y:112 }];
    e.state = 'dive'; e.u = 0; e.beamMode = true;
  } else {
    const side = rnd(-70, 70);
    e.divePath = [p0,
      { x:p0.x + rnd(-55, 55), y:p0.y + 30 },
      { x:player.x + side, y:180 },
      { x:player.x + rnd(-25, 25), y:320 }];
    e.state = 'dive'; e.u = 0; e.beamMode = false;
    e.shootT = Math.random() < 0.7 ? rnd(0.15, 0.5) : 99;
    if (e.type === 'boss' && game.stage >= 2 && Math.random() < 0.5){
      /* boss dive with 1-2 Goei escorts */
      const n = enemies.filter(o => o.type === 'goei' && o.state === 'form');
      const cnt = Math.min(irnd(1, 2), n.length);
      for (let i = 0; i < cnt; i++){
        const g = n[irnd(0, n.length - 1)];
        if (g.state !== 'form') continue;
        g.escortOf = e;
        const off = (i === 0 ? -20 : 20);
        g.divePath = [
          { x:g.x, y:g.y },
          { x:g.x + off * 0.5, y:g.y + 25 },
          { x:player.x + side + off, y:190 },
          { x:player.x + off, y:320 }];
        g.state = 'dive'; g.u = 0; g.beamMode = false; g.shootT = 99;
      }
    }
  }
}
function beginReturn(e){
  e.state = 'return'; e.u = 0;
  const s = slotPos(e);
  e.retPath = [{ x:clamp(rnd(20, 204), 20, 204), y:-18 },
               { x:s.x + rnd(-50, 50), y:rnd(30, 80) },
               { x:s.x, y:s.y }];
}
function fireAtPlayer(e, spd){
  const dx = player.x - e.x, dy = 236 - e.y, d = Math.hypot(dx, dy) || 1;
  eBullets.push({ x:e.x, y:e.y + 4, vx:dx / d * spd, vy:dy / d * spd });
}

/* --------------------------- combat helpers --------------------------- */
function boom(x, y, isPlayer){ explosions.push({ x, y, t:0, dur:isPlayer ? 0.6 : 0.4, p:!!isPlayer }); }
function addHit(){ game.shotsHit++; }
function killEnemy(e, bi){
  const idx = enemies.indexOf(e); if (idx < 0) return;
  enemies.splice(idx, 1);
  if (e.state === 'beam' && game.captureBoss === e) game.captureBoss = null;
  let pts = 0;
  const diving = !(e.state === 'form' || e.state === 'toSlot' || e.state === 'wait');
  if (game.mode === 'challenge'){
    pts = 100;
    if (game.challenge){ game.challenge.hits++; game.challenge.waves[e.wave]++; }
  } else if (e.type === 'zako') pts = diving ? 100 : 50;
  else if (e.type === 'goei')  pts = diving ? 160 : 80;
  else { /* boss */
    if (diving){
      const esc = enemies.filter(o => o.escortOf === e && o.state === 'dive').length;
      pts = 400 * (1 << esc);
    } else pts = 150;
  }
  addScore(pts);
  boom(e.x, e.y, false);
  sfx(e.type === 'boss' ? 'bossHit' : 'enemyDie');
  if (e.type === 'boss' && e.captive){
    if (diving){
      /* freed captive flies down and docks -> dual fighter */
      freedShips.push({ x:e.x, y:e.y - 14 });
    } else {
      /* killed in formation: captive is destroyed too */
      const s = slotPos(e);
      boom(s.x, s.y - 16, true);
    }
  }
  if (bi !== undefined) pBullets.splice(bi, 1);
}
function hitPlayerHalf(hx){
  if (player.dual){
    const side = hx < player.x ? -1 : 1;
    boom(player.x + side * 6, 236, true);
    player.dual = false;
    player.x -= side * 6;
    player.invuln = 1.0;
    sfx('playerDie');
  } else {
    boom(player.x, 236, true);
    sfx('playerDie');
    player.alive = false;
    if (player.lives > 0){
      player.lives--;
      game.mode = 'respawn'; game.timer = 1.8;
    } else {
      game.mode = 'gameover'; game.timer = 2.8;
    }
  }
}
function beginCapture(boss){
  game.mode = 'capture';
  game.captureBoss = boss;
  game.captureT = 0;
  game.captureFrom = { x:player.x, y:236 };
  boss.beamT = Math.max(boss.beamT, 2.0);
}
function completeCapture(){
  const boss = game.captureBoss;
  if (boss) boss.captive = true;
  game.captureBoss = null;
  if (player.dual){
    player.dual = false;               /* beam takes one of the two fighters */
    game.mode = 'play';
    player.invuln = 1.2;
  } else {
    player.alive = false;
    if (player.lives > 0){ player.lives--; game.mode = 'respawn'; game.timer = 1.8; }
    else { game.mode = 'gameover'; game.timer = 2.8; }
  }
}

/* ------------------------------ updating ------------------------------ */
function update(dt){
  game.t += dt;
  for (const s of stars){
    s.y += s.v * dt;
    if (s.y > H){ s.y = -1; s.x = rnd(0, W); }
  }
  if (game.paused) return;
  switch (game.mode){
    case 'attract': case 'results': break;
    case 'stageIntro':
      game.timer -= dt;
      if (game.timer <= 0){
        if (game.challenge){ game.mode = 'challenge'; game.challenge.waveTimer = 0.8; }
        else beginEntry();
      }
      break;
    case 'play':      updatePlay(dt); break;
    case 'challenge': updateChallenge(dt); break;
    case 'respawn':
      updateEnemies(dt); updateBullets(dt); updateFx(dt);
      game.timer -= dt;
      if (game.timer <= 0){
        player.alive = true; player.x = 112; player.invuln = 1.5;
        game.diveAllow = game.t + 1.2;
        game.mode = 'play';
      }
      break;
    case 'capture':
      game.captureT += dt / 1.1;
      updateEnemies(dt); updateBullets(dt); updateFx(dt);
      if (game.captureT >= 1) completeCapture();
      break;
    case 'stageClear':
      updateFx(dt);
      game.timer -= dt;
      if (game.timer <= 0){ game.stage++; beginStage(); }
      break;
    case 'challengeEnd':
      updateFx(dt);
      game.timer -= dt;
      if (game.timer <= 0){ game.stage++; beginStage(); }
      break;
    case 'gameover':
      updateEnemies(dt); updateBullets(dt); updateFx(dt);
      game.timer -= dt;
      if (game.timer <= 0) game.mode = 'results';
      break;
  }
}
function updatePlay(dt){
  /* player movement */
  if (player.alive){
    const sp = 140;
    if (keys.l) player.x -= sp * dt;
    if (keys.r) player.x += sp * dt;
    player.x = clamp(player.x, 12, 212);
  }
  if (player.invuln > 0) player.invuln -= dt;

  updateBullets(dt);
  updateEnemies(dt);

  /* formation "breathes" only when every enemy is in its slot */
  let allForm = enemies.length > 0;
  for (const e of enemies) if (e.state !== 'form'){ allForm = false; break; }
  game.breathMix += ((allForm ? 1 : 0) - game.breathMix) * Math.min(1, dt * 2);

  /* dive scheduling - never while respawning / before grace period */
  if (player.alive && game.t > game.diveAllow){
    game.diveTimer -= dt;
    if (game.diveTimer <= 0){
      startDive();
      game.diveTimer = Math.max(0.4, 2.2 - game.stage * 0.12) * rnd(0.6, 1.4);
    }
  }

  updateFreed(dt);
  collisions();
  updateFx(dt);

  if (enemies.length === 0 && game.mode === 'play'){
    game.mode = 'stageClear'; game.timer = 2.0;
  }
}
function updateChallenge(dt){
  const ch = game.challenge;
  if (player.alive){
    const sp = 140;
    if (keys.l) player.x -= sp * dt;
    if (keys.r) player.x += sp * dt;
    player.x = clamp(player.x, 12, 212);
  }
  if (player.invuln > 0) player.invuln -= dt;

  /* spawn waves of 8 */
  if (!ch.done){
    ch.waveTimer -= dt;
    if (ch.waveTimer <= 0 && ch.wave < 4){
      ch.wave++; ch.waves.push(0);
      const fromLeft = ch.wave % 2 === 0;
      const by = 40 + (ch.wave % 3) * 20;
      for (let i = 0; i < 8; i++){
        const type = i % 4 === 0 ? 'goei' : 'zako';
        const e = mkEnemy(1000 + ch.spawned++, type, -30, by, 0);
        e.wave = ch.wave;
        e.state = 'wait';
        e.startTime = game.t + i * 0.32;
        e.chal = { fromLeft, by, delay:i * 0.32 };
        e.path = [{ x:fromLeft ? -20 : 244, y:by }, { x:112, y:by }];  /* placeholder */
        enemies.push(e);
      }
      ch.waveTimer = 4.2;
    }
    if (ch.wave === 4 && enemies.length === 0) ch.done = true;
  }

  updateEnemies(dt);
  updateBullets(dt);
  collisions();
  updateFx(dt);

  if (ch.done){
    /* tally wave bonuses */
    if (ch.bonus < 0){
      ch.bonus = 0;
      for (let w = 0; w < 5; w++) if (ch.waves[w] === 8) ch.bonus += 1000;
      if (ch.hits === 40) ch.bonus += 10000;
      addScore(ch.bonus);
      game.mode = 'challengeEnd'; game.timer = 4.0;
    }
  }
}
function updateEnemies(dt){
  const diveSpd = 0.42 + game.stage * 0.02;
  const bulletSpd = 95 + game.stage * 6;
  for (let i = enemies.length - 1; i >= 0; i--){
    const e = enemies[i];
    switch (e.state){
      case 'wait':
        if (game.t >= e.startTime){
          if (game.mode === 'challenge'){ e.state = 'chal'; e.u = 0; }
          else { e.state = 'path'; e.u = 0; }
        }
        break;
      case 'path': {
        e.u += 0.30 * dt;
        const p = catmull(e.path, e.u);
        e.x = p.x; e.y = p.y;
        if (e.u >= 1){ e.state = 'toSlot'; e.from = { x:e.x, y:e.y }; e.k = 0; }
        /* entering enemies may fire */
        e.shootT -= dt;
        if (e.shootT <= 0){
          if (player.alive && e.y > 20 && e.y < 180 && Math.random() < 0.5) fireAtPlayer(e, bulletSpd);
          e.shootT = rnd(1.5, 3.5);
        }
        break; }
      case 'toSlot': {
        e.k = Math.min(1, e.k + dt * 2.2);
        const s = slotPos(e), k = e.k * e.k * (3 - 2 * e.k);
        e.x = e.from.x + (s.x - e.from.x) * k;
        e.y = e.from.y + (s.y - e.from.y) * k;
        if (e.k >= 1) e.state = 'form';
        break; }
      case 'form': {
        const s = slotPos(e); e.x = s.x; e.y = s.y;
        break; }
      case 'dive': {
        e.u += diveSpd * dt;
        const p = catmull(e.divePath, e.u);
        e.x = p.x; e.y = p.y;
        if (e.beamMode){
          if (e.u >= 1){ e.state = 'beam'; e.beamT = 2.8; e.beepT = 0; }
        } else {
          e.shootT -= dt;
          if (e.shootT <= 0 && player.alive && e.y > 30 && e.y < 210){
            fireAtPlayer(e, bulletSpd);
            e.shootT = rnd(0.4, 0.9);
          }
          /* captive held by a diving boss also fires */
          if (e.captive && player.alive && Math.random() < 0.005)
            eBullets.push({ x:e.x, y:e.y - 10, vx:rnd(-25, 25), vy:bulletSpd });
          if (e.y > 300 || e.u >= 1){ e.escortOf = null; beginReturn(e); }
        }
        break; }
      case 'beam': {
        e.beepT -= dt;
        if (e.beepT <= 0){ sfx('beam'); e.beepT = 0.18; }
        e.beamT -= dt;
        /* capture check: is the player inside the cone? */
        if (game.mode === 'play' && player.alive && player.invuln <= 0){
          const y0 = e.y + 6;
          const hw = 20 * (236 - y0) / (288 - y0);
          if (236 > y0 && Math.abs(player.x - e.x) < Math.max(5, hw * 0.72)) beginCapture(e);
        }
        if (e.beamT <= 0){
          const s = slotPos(e);
          e.state = 'return'; e.u = 0;
          e.retPath = [{ x:e.x, y:e.y }, { x:(e.x + s.x) / 2, y:e.y - 50 }, { x:s.x, y:s.y }];
        }
        break; }
      case 'return': {
        e.u += 0.5 * dt;
        const p = catmull(e.retPath, e.u);
        e.x = p.x; e.y = p.y;
        e.shootT -= dt;
        if (e.shootT <= 0){
          if (player.alive && e.y > 10 && e.y < 170 && Math.random() < 0.4) fireAtPlayer(e, bulletSpd);
          e.shootT = rnd(1.2, 2.5);
        }
        if (e.u >= 1){ e.state = 'toSlot'; e.from = { x:e.x, y:e.y }; e.k = 0; }
        break; }
      case 'chal': {
        /* looping fly-through, no firing, does not stay */
        e.u += 0.16 * dt;
        const t = e.u, dir = e.chal.fromLeft ? 1 : -1;
        e.x = (e.chal.fromLeft ? -20 : 244) + dir * t * 290;
        e.y = e.chal.by + Math.sin(t * Math.PI * 4) * 45;
        if (e.u >= 1){
          const w = e.wave;
          enemies.splice(i, 1);
          if (game.challenge && game.challenge.waves[w] < 8){ /* escaped */ }
        }
        break; }
    }
  }
}
function updateBullets(dt){
  for (let i = pBullets.length - 1; i >= 0; i--){
    const b = pBullets[i]; b.y -= 340 * dt;
    if (b.y < -6) pBullets.splice(i, 1);
  }
  for (let i = eBullets.length - 1; i >= 0; i--){
    const b = eBullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y > 282 || b.y < -6 || b.x < -6 || b.x > 230) eBullets.splice(i, 1);
  }
}
function updateFreed(dt){
  for (let i = freedShips.length - 1; i >= 0; i--){
    const f = freedShips[i];
    f.y += 70 * dt;
    if (f.y > 190 && player.alive) f.x += (player.x - f.x) * Math.min(1, dt * 6);
    if (f.y >= 228 && player.alive && !player.dual && Math.abs(f.x - player.x) < 8){
      player.dual = true; freedShips.splice(i, 1); sfx('dock');
    } else if (f.y > 300) freedShips.splice(i, 1);
  }
}
function updateFx(dt){
  for (let i = explosions.length - 1; i >= 0; i--){
    explosions[i].t += dt;
    if (explosions[i].t > explosions[i].dur) explosions.splice(i, 1);
  }
}
function playerBoxes(){
  if (!player.alive) return [];
  if (player.dual)
    return [{ x:player.x - 6, y:236, w:9, h:11 }, { x:player.x + 6, y:236, w:9, h:11 }];
  return [{ x:player.x, y:236, w:9, h:11 }];
}
function enemyBox(e){
  const s = e.type === 'boss' ? 12 : 10;
  return { x:e.x, y:e.y, w:s, h:s };
}
function collisions(){
  /* player bullets vs captives, then vs enemies */
  for (let i = pBullets.length - 1; i >= 0; i--){
    const b = pBullets[i];
    let hit = false;
    for (const e of enemies){
      if (e.type !== 'boss' || !e.captive) continue;
      const cx = e.x, cy = e.y - 16;
      if (overlap(b.x, b.y - 1, 1, 5, cx, cy, 9, 11)){
        boom(cx, cy, true); addScore(100); e.captive = false;
        addHit(); pBullets.splice(i, 1); hit = true; sfx('enemyDie'); break;
      }
    }
    if (hit) continue;
    for (const e of enemies){
      if (e.state === 'wait') continue;
      const eb = enemyBox(e);
      if (overlap(b.x, b.y - 1, 1, 5, eb.x, eb.y, eb.w, eb.h)){
        addHit();
        if (e.type === 'boss' && e.hp > 1){
          e.hp--; pBullets.splice(i, 1); sfx('bossHit');
        } else {
          killEnemy(e, i);
        }
        hit = true; break;
      }
    }
  }
  if (game.mode === 'capture') return;
  const canBeHit = (game.mode === 'play' || game.mode === 'challenge') &&
                    player.alive && player.invuln <= 0;
  if (!canBeHit) return;
  const boxes = playerBoxes();
  /* enemy bullets vs player */
  for (let i = eBullets.length - 1; i >= 0; i--){
    const b = eBullets[i];
    for (const bx of boxes){
      if (overlap(b.x, b.y, 2, 4, bx.x, bx.y, bx.w, bx.h)){
        eBullets.splice(i, 1); hitPlayerHalf(b.x); return;
      }
    }
  }
  /* ramming */
  for (const e of enemies){
    if (e.state === 'wait' || e.state === 'form' || e.state === 'toSlot') continue;
    const eb = enemyBox(e);
    for (const bx of boxes){
      if (overlap(eb.x, eb.y, eb.w, eb.h, bx.x, bx.y, bx.w, bx.h)){
        killEnemy(e);
        hitPlayerHalf(e.x);
        return;
      }
    }
  }
}

/* ------------------------------ rendering ------------------------------ */
const frame2 = () => (game.t * 4 | 0) % 2;
function render(){
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  drawStars();
  switch (game.mode){
    case 'attract':      drawAttract(); break;
    case 'results':      drawResults(); break;
    default:             drawGame();    break;
  }
}
function drawStars(){
  for (const s of stars){
    const a = 0.55 + 0.45 * Math.sin(game.t * 5 + s.ph);
    ctx.globalAlpha = a;
    ctx.fillStyle = s.c;
    ctx.fillRect(s.x | 0, s.y | 0, 1, 1);
  }
  ctx.globalAlpha = 1;
}
function drawHUD(){
  T('1UP', 10, 6, (game.t * 2 | 0) % 2 ? '#ff3030' : '#ff8080');
  T(String(game.score), 10, 15);
  T('HIGH SCORE', 112, 6, '#ff3030', 8, 'center');
  T(String(game.hi), 112, 15, '#ffffff', 8, 'center');
  /* reserve ships, bottom left */
  for (let i = 0; i < Math.min(player.lives, 6); i++)
    drawSpr(SPR.player[0], 14 + i * 16, 276, PAL.player);
  /* stage flags, bottom right */
  let n = game.stage, x = 218;
  for (const d of [50, 20, 10, 5, 1]){
    while (n >= d){
      n -= d;
      ctx.fillStyle = '#808080'; ctx.fillRect(x, 270, 1, 11);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(x - 9, 270, 10, 7);
      ctx.fillStyle = '#ff2020'; ctx.fillRect(x - 9, 270, 10, 1); ctx.fillRect(x - 9, 276, 10, 1);
      ctx.fillRect(x - 9, 271, 1, 5); ctx.fillRect(x, 271, 1, 5);
      T(String(d), x - 4, 272, '#000000', 6, 'center');
      x -= 13;
    }
  }
}
function drawEnemySprite(e){
  const f = frame2();
  if (e.type === 'zako')      drawSpr(SPR.zako[f], e.x, e.y, PAL.zako);
  else if (e.type === 'goei') drawSpr(SPR.goei[f], e.x, e.y, PAL.goei);
  else                        drawSpr(SPR.boss[f], e.x, e.y, e.hp < 2 ? PAL.bossHit : PAL.boss);
}
function drawBeam(e){
  const y0 = e.y + 6, y1 = 284;
  const hw = 20, steps = 14;
  for (let i = 0; i < steps; i++){
    const t0 = i / steps, t1 = (i + 1) / steps;
    const ya = y0 + (y1 - y0) * t0, yb = y0 + (y1 - y0) * t1;
    const ha = hw * t0, hb = hw * t1;
    const bright = ((i + (game.t * 12 | 0)) % 3 === 0);
    ctx.fillStyle = bright ? '#a0e0ff' : '#2855d0';
    ctx.globalAlpha = 0.55;
    ctx.beginPath();
    ctx.moveTo(e.x - ha, ya); ctx.lineTo(e.x + ha, ya);
    ctx.lineTo(e.x + hb, yb); ctx.lineTo(e.x - hb, yb);
    ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawExplosion(x, y, f, isPlayer){
  const n = isPlayer ? 10 : 8;
  const cols = isPlayer ? ['#ffffff', '#80c0ff', '#ff4040'] : ['#ffffff', '#ffd020', '#ff5000'];
  for (let i = 0; i < n; i++){
    const a = i / n * Math.PI * 2 + (isPlayer ? 0.4 : 0);
    const r = 1 + f * (isPlayer ? 13 : 9);
    const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    ctx.fillStyle = cols[i % 3];
    const s = f < 0.5 ? 2 : 1;
    ctx.fillRect(px - s / 2, py - s / 2, s, s);
  }
  if (f < 0.4){ ctx.fillStyle = '#ffffff'; ctx.fillRect(x - 2, y - 2, 4, 4); }
}
function drawGame(){
  drawHUD();
  /* tractor beams behind enemies */
  for (const e of enemies) if (e.state === 'beam') drawBeam(e);
  /* enemies + captives */
  for (const e of enemies){
    if (e.state === 'wait') continue;
    drawEnemySprite(e);
    if (e.type === 'boss' && e.captive)
      drawSpr(SPR.player[0], e.x, e.y - 16, PAL.captured);
  }
  /* freed captive ship */
  for (const f of freedShips) drawSpr(SPR.player[0], f.x, f.y, PAL.player);
  /* player */
  const blink = player.invuln > 0 && (game.t * 12 | 0) % 2;
  if (game.mode === 'capture'){
    const b = game.captureBoss;
    if (b){
      const k = game.captureT;
      const px = game.captureFrom.x + (b.x - game.captureFrom.x) * k;
      const py = game.captureFrom.y + (b.y - 16 - game.captureFrom.y) * k;
      drawSpr(SPR.player[0], px, py, k > 0.55 ? PAL.captured : PAL.player);
    }
  } else if (player.alive && !blink){
    if (player.dual){
      drawSpr(SPR.player[0], player.x - 6, 236, PAL.player);
      drawSpr(SPR.player[0], player.x + 6, 236, PAL.player);
    } else {
      drawSpr(SPR.player[0], player.x, 236, PAL.player);
    }
  }
  /* bullets */
  ctx.fillStyle = '#ffffff';
  for (const b of pBullets) ctx.fillRect(b.x | 0, b.y | 0, 1, 5);
  ctx.fillStyle = '#70e0ff';
  for (const b of eBullets) ctx.fillRect(b.x | 0, b.y | 0, 2, 4);
  /* explosions */
  for (const ex of explosions)
    drawExplosion(ex.x, ex.y, ex.t / ex.dur, ex.p);
  /* overlays */
  if (game.mode === 'stageIntro'){
    T('STAGE ' + game.stage, 112, 140, '#ffffff', 10, 'center');
    if (isChallenge(game.stage)) T('CHALLENGING STAGE!', 112, 156, '#ffd020', 8, 'center');
  }
  if (game.mode === 'respawn') T('READY', 112, 150, '#ffd020', 10, 'center');
  if (game.mode === 'stageClear'){
    T('STAGE ' + game.stage + ' CLEAR!', 112, 140, '#40ff80', 10, 'center');
  }
  if (game.mode === 'challengeEnd') drawChallengeEnd();
  if (game.mode === 'gameover') T('GAME OVER', 112, 140, '#ff4040', 10, 'center');
  if (game.paused) T('PAUSE', 112, 130, '#ffff40', 10, 'center');
}
function drawChallengeEnd(){
  const ch = game.challenge;
  ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, 90, W, 110);
  T('NUMBER OF HITS', 112, 100, '#ffffff', 9, 'center');
  T(String(ch.hits), 112, 116, '#ffd020', 12, 'center');
  let yy = 136;
  for (let w = 0; w < 5; w++){
    if (ch.waves[w] === 8){ T('WAVE ' + (w + 1) + ' BONUS', 70, yy, '#40ff80', 7); T('1000', 165, yy, '#40ff80', 7, 'right'); yy += 10; }
  }
  T('TOTAL BONUS', 70, yy + 4, '#ffffff', 8);
  T(String(ch.bonus), 165, yy + 4, '#ffffff', 8, 'right');
  if (ch.hits === 40 && (game.t * 3 | 0) % 2)
    T('PERFECT!', 112, yy + 20, '#ff4040', 10, 'center');
}
function drawAttract(){
  /* title */
  const title = 'GALAGA', cols = ['#ff3030', '#ff9020', '#ffe020', '#40d040', '#40a0ff', '#b060ff'];
  ctx.font = 'bold 22px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  let tw = 0, widths = [];
  for (const ch of title){ const w = ctx.measureText(ch).width; widths.push(w); tw += w; }
  let x = 112 - tw / 2;
  for (let i = 0; i < title.length; i++){
    ctx.textAlign = 'left';
    ctx.fillStyle = '#203080'; ctx.fillText(title[i], x + 1, 31);
    ctx.fillStyle = cols[i];   ctx.fillText(title[i], x, 30);
    x += widths[i];
  }
  T('1981 NAMCO CLASSIC', 112, 56, '#6070a0', 7, 'center');
  /* score table */
  T('IN FORMATION   DIVING', 112, 72, '#909090', 7, 'center');
  drawSpr(SPR.zako[frame2()], 60, 88, PAL.zako);
  T('50', 92, 84, '#ffffff', 8, 'right'); T('100', 132, 84, '#ffffff', 8, 'right');
  drawSpr(SPR.goei[frame2()], 60, 104, PAL.goei);
  T('80', 92, 100, '#ffffff', 8, 'right'); T('160', 132, 100, '#ffffff', 8, 'right');
  drawSpr(SPR.boss[frame2()], 60, 122, PAL.boss);
  T('150', 92, 118, '#ffffff', 8, 'right'); T('400', 132, 118, '#ffffff', 8, 'right');
  T('800 / 1600 WITH ESCORTS', 112, 134, '#80a0ff', 7, 'center');
  drawSpr(SPR.player[0], 60, 152, PAL.player);
  T('DUAL FIGHTER', 100, 148, '#80ffb0', 7);
  T('1ST 20,000  EVERY 70,000 AFTER', 112, 166, '#80a0ff', 7, 'center');
  T('HIGH SCORE  ' + game.hi, 112, 186, '#ff3030', 8, 'center');
  if ((game.t * 2 | 0) % 2) T('PRESS ENTER TO START', 112, 210, '#ffffff', 8, 'center');
  T('ARROWS/AD MOVE  SPACE FIRE', 112, 240, '#606060', 7, 'center');
  T('P PAUSE   M MUTE', 112, 252, '#606060', 7, 'center');
  T('CREDIT 01', 10, 276, '#ffffff', 7);
}
function drawResults(){
  T('HIT RATIO', 112, 60, '#ff3030', 10, 'center');
  const f = game.shotsFired || 1;
  const pct = Math.round(game.shotsHit / f * 100);
  T('FIRED', 60, 100, '#ffffff', 9); T(String(game.shotsFired), 160, 100, '#ffffff', 9, 'right');
  T('HIT',  60, 118, '#ffffff', 9); T(String(game.shotsHit), 160, 118, '#ffffff', 9, 'right');
  T('RATIO', 60, 136, '#ffd020', 9); T(pct + '%', 160, 136, '#ffd020', 9, 'right');
  T('FINAL SCORE  ' + game.score, 112, 170, '#ffffff', 8, 'center');
  if ((game.t * 2 | 0) % 2) T('PRESS ENTER', 112, 210, '#ffffff', 8, 'center');
}

/* ------------------------------ main loop ------------------------------ */
/* Fixed-timestep update so game speed is independent of refresh rate. */
const DT = 1 / 60;
let last = performance.now(), acc = 0;
function frame(now){
  requestAnimationFrame(frame);
  acc += Math.min(0.1, (now - last) / 1000);
  last = now;
  while (acc >= DT){ update(DT); acc -= DT; }
  render();
}
requestAnimationFrame(frame);
</script>
