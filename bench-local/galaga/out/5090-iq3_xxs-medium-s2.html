<script>
"use strict";
/* =========================================================================
   GALAGA clone - single file, no external resources.
   Internal logical resolution 224x288 (arcade 3:4), scaled crisp to window.
   ========================================================================= */

/* ---------- canvas setup ---------- */
const GW=224, GH=288;
const view=document.getElementById('screen');
const vctx=view.getContext('2d');
const cv=document.createElement('canvas'); cv.width=GW; cv.height=GH;
const ctx=cv.getContext('2d');
let scale=2;
function resize(){
  scale=Math.max(2,Math.floor(Math.min(window.innerWidth/GW, window.innerHeight/GH)));
  view.width=GW*scale; view.height=GH*scale;
  vctx.imageSmoothingEnabled=false;
}
window.addEventListener('resize',resize); resize();

/* ---------- helpers ---------- */
function rand(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function bez(p,t){ // cubic bezier, p=[[x,y],...]
  const u=1-t;
  return [ u*u*u*p[0][0]+3*u*u*t*p[1][0]+3*u*t*t*p[2][0]+t*t*t*p[3][0],
           u*u*u*p[0][1]+3*u*u*t*p[1][1]+3*u*t*t*p[2][1]+t*t*t*p[3][1] ];
}
function polyPoint(pts,d){ // point at distance d along polyline, returns [x,y,angle] or null
  let s=0;
  for(let i=0;i<pts.length-1;i++){
    const dx=pts[i+1][0]-pts[i][0], dy=pts[i+1][1]-pts[i][1], L=Math.hypot(dx,dy);
    if(s+L>=d){const t=(d-s)/L;return [pts[i][0]+dx*t,pts[i][1]+dy*t,Math.atan2(dy,dx)];}
    s+=L;
  }
  return null;
}
function polyLen(pts){let s=0;for(let i=0;i<pts.length-1;i++)s+=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]);return s;}

function makeSPR(rows){return rows;}
function recolor(rows,map){return rows.map(r=>r.split('').map(ch=>map[ch]||ch).join(''));}

function drawSprite(spr,x,y){ // x,y = top-left
  for(let r=0;r<spr.length;r++){
    const row=spr[r];
    for(let c=0;c<16;c++){
      const ch=row[c];
      if(ch==='.')continue;
      ctx.fillStyle=PAL[ch];
      ctx.fillRect(x+c,y+r,1,1);
    }
  }
}
function drawEnemy(e){
  let spr;
  if(e.type==='zako')spr=SPR.zako[e.frame];
  else if(e.type==='goei')spr=SPR.goei[e.frame];
  else spr=(e.hp<2?SPR.bossHit:SPR.boss)[e.frame];
  drawSprite(spr,Math.round(e.x-8),Math.round(e.y-6));
}
function drawPlayerShip(x,y,captured){
  drawSprite(captured?SPR.playerCaptured:SPR.player,Math.round(x-8),Math.round(y-7));
}

/* ---------- audio (Web Audio synthesized) ---------- */
let AC=null,master=null,muted=false;
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=0.3; master.connect(AC.destination);
  }catch(e){}
}
function tone(f0,f1,dur,type,vol,delay){
  if(!AC||muted)return;
  const t0=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t0);
  o.frequency.linearRampToValueAtTime(Math.max(1,f1),t0+dur);
  g.gain.setValueAtTime(vol,t0);
  g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.02);
}
function noiseBurst(dur,vol,fc){
  if(!AC||muted)return;
  const n=Math.floor(AC.sampleRate*dur);
  const buf=AC.createBuffer(1,n,AC.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const src=AC.createBufferSource(); src.buffer=buf;
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=fc;
  const g=AC.createGain(); g.gain.value=vol;
  src.connect(f); f.connect(g); g.connect(master); src.start();
}
const sShot   =()=>tone(950,350,0.07,'square',0.12);
const sEnemyHit=()=>{noiseBurst(0.18,0.28,1500);};
const sBossHit =()=>{tone(320,120,0.12,'square',0.22);noiseBurst(0.08,0.15,800);};
const sBoom    =()=>{noiseBurst(0.55,0.4,700);tone(220,40,0.5,'sawtooth',0.18);};
const sBossBoom=()=>{noiseBurst(0.4,0.35,1000);tone(400,60,0.4,'square',0.2);};
const sTractor =()=>{tone(240,560,0.28,'sawtooth',0.07);tone(560,240,0.28,'sawtooth',0.05,0.28);};
const sCapture =()=>{tone(700,90,0.9,'square',0.14);};
const sDock    =()=>{tone(300,300,0.08,'square',0.15,0);tone(450,450,0.08,'square',0.15,0.09);tone(600,600,0.12,'square',0.15,0.18);};
const sStage   =()=>{tone(392,392,0.10,'square',0.15,0);tone(523,523,0.10,'square',0.15,0.11);tone(659,659,0.10,'square',0.15,0.22);tone(784,784,0.20,'square',0.15,0.33);};
const sBonus   =()=>{tone(523,523,0.07,'square',0.15,0);tone(659,659,0.07,'square',0.15,0.08);tone(784,784,0.14,'square',0.15,0.16);};

/* ---------- starfield ---------- */
const stars=[];
for(let i=0;i<110;i++){
  const cols=['#ffffff','#88bbff','#ffdd88','#ff8888','#88ffcc','#ffffff'];
  stars.push({x:rand(0,GW),y:rand(0,GH),vy:rand(6,34),c:cols[(Math.random()*cols.length)|0],
              tw:rand(0,6.28),ts:rand(1,4),size:Math.random()<0.15?2:1});
}
function updateStars(dt){
  for(const s of stars){s.y+=s.vy*dt;s.tw+=s.ts*dt;if(s.y>GH){s.y=-2;s.x=rand(0,GW);}}
}
function drawStars(){
  for(const s of stars){
    const a=0.45+0.55*Math.abs(Math.sin(s.tw));
    ctx.globalAlpha=a; ctx.fillStyle=s.c; ctx.fillRect(s.x|0,s.y|0,s.size,s.size);
  }
  ctx.globalAlpha=1;
}

/* ---------- game state ---------- */
let state='title';            // title | stageIntro | play | challenging | results | gameOver
let paused=false;
let score=0, high=parseInt(localStorage.getItem('galagaHigh')||'0',10)||0, stage=1, lives=3;
let nextExtra=20000;          // extra ship at 20000, then every 70000
let shotsFired=0, shotsHit=0;
let enemies=[], pBullets=[], eBullets=[], explosions=[];
let player={x:112,y:252,alive:true,dual:false,respawn:0,dying:0,invuln:0};
let captive=null;             // {x,y,state:'pull'|'free',boss,t,dockT}
let beam=null;                // {boss,t,dur}
let entryQueue=[], diveTimer=3, stageTime=0, introTimer=0, msg=null, flashT=0;
let challenge=null, resultsTimer=0, gameOverTimer=0;
let keys={}, fireEdge=false;
const formation={sway:0,breathe:1};

/* ---------- formation layout ---------- */
function formationList(){
  const rows=[['boss',[2,3,4,5]],['goei',[0,1,2,3,4,5,6,7]],['goei',[0,1,2,3,4,5,6,7]],
              ['zako',[0,1,2,3,4,5,6,7]],['zako',[0,1,2,3,4,5,6,7]]];
  const list=[];
  rows.forEach((r,i)=>r[1].forEach(c=>list.push({row:i,col:c,type:r[0]})));
  return list;
}
function slotPos(row,col){
  const cx=112+formation.sway, cy=54+row*20;
  return {x:cx+(col-3.5)*24*formation.breathe, y:cy+(row-2)*(formation.breathe-1)*6};
}

/* ---------- enemy creation ---------- */
function spawnEnemy(type,row,col,path){
  const e={type,row,col,state:'enter',path,t:0,x:path.p0[0],y:path.p0[1],
           frame:(Math.random()*2|0),frameT:Math.random(),hp:type==='boss'?2:1,
           fireT:rand(0.5,2.5),escorts:null,escortsOff:null,escortsN:0,
           diveKind:null,beamTargetY:0,captive:false,dead:false,
           wave:-1,poly:null,polyD:0,polyLen:0,off:0,angle:0};
  enemies.push(e); return e;
}
function entryPath(row,col,side){
  const s=slotPos(row,col);
  if(side<0)return {p0:[-24,GH+16],p1:[70,215],p2:[-60,55],p3:[s.x,s.y]};
  return {p0:[GW+24,GH+16],p1:[GW-70,215],p2:[GW+60,55],p3:[s.x,s.y]};
}
function buildEntryGroups(){
  entryQueue=[];
  const list=formationList();
  // 5 groups: bottom zako row, upper zako row, lower goei row, upper goei row, bosses
  const groups=[[],[],[],[],[]];
  for(const f of list){
    if(f.type==='boss')groups[4].push(f);
    else if(f.type==='goei')groups[f.row===1?3:2].push(f);
    else groups[f.row===3?1:0].push(f);
  }
  groups.forEach((g,i)=>entryQueue.push({members:g,start:i*2.0,spawned:false,side:(i%2===0)?-1:1}));
}

/* ---------- scoring ---------- */
function addScore(p){
  score+=p;
  if(score>high){high=score;localStorage.setItem('galagaHigh',String(high));}
  while(score>=nextExtra){lives++;nextExtra+=70000;}
}
function pointsFor(e){
  if(state==='challenging')return 100;
  const inFormation=(e.state==='enter'||e.state==='formation');
  if(e.type==='zako')return inFormation?50:100;
  if(e.type==='goei')return inFormation?80:160;
  if(e.type==='boss'){
    if(inFormation)return 150;
    const n=e.escortsN;
    return n===0?400:(n===1?800:1600);
  }
  return 50;
}

/* ---------- explosions ---------- */
function explode(x,y,kind){explosions.push({x,y,t:0,kind});}

/* ---------- stage flow ---------- */
function startGame(){
  score=0;stage=1;lives=3;nextExtra=20000;shotsFired=0;shotsHit=0;
  captive=null;beam=null;
  startStageIntro();
}
function isChallenge(s){return (s-3)%4===0 && s>=3;}
function startStageIntro(){
  state='stageIntro';introTimer=2.4;
  enemies=[];pBullets=[];eBullets=[];explosions=[];beam=null;
  if(captive&&captive.state==='held')captive=null; // captive lost between stages
  player.alive=true;player.dual=false;player.respawn=0;player.dying=0;player.invuln=1;player.x=112;
  sStage();
}
function beginStagePlay(){
  stageTime=0;diveTimer=Math.max(1.5,4-stage*0.3);
  if(isChallenge(stage)){
    challenge={wave:0,waveTimer:0,hits:0,waveKills:0,waveEscaped:false,perfect:true,
               spawnedAll:false,doneTimer:0};
    state='challenging';
    spawnChallengeWave();
  }else{
    state='play';
    buildEntryGroups();
  }
}
function stageComplete(){
  stage++;
  startStageIntro();
}

/* ---------- challenging stage ---------- */
const CH_PATHS=[
  [[-20,210],[50,60],[112,130],[180,60],[244,210],[180,300],[112,330]],
  [[244,210],[174,60],[112,130],[44,60],[-20,210],[44,300],[112,330]],
  [[-20,110],[112,30],[244,110],[112,210],[-20,110],[112,30],[244,330]],
  [[244,110],[112,30],[-20,110],[112,210],[244,110],[112,30],[-20,330]],
  [[112,-20],[40,70],[112,150],[184,70],[112,-20],[112,200],[112,330]]
];
const CH_TYPES=['zako','goei','goei','zako','boss'];
function spawnChallengeWave(){
  const w=challenge.wave;
  const pts=CH_PATHS[w%CH_PATHS.length];
  const type=CH_TYPES[w%CH_TYPES.length];
  const total=polyLen(pts);
  for(let i=0;i<8;i++){
    const e=spawnEnemy(type,0,i,{p0:[pts[0][0],pts[0][1]],p1:[0,0],p2:[0,0],p3:[0,0]});
    e.state='path';e.poly=pts;e.polyD=-i*15;e.polyLen=total;e.wave=w;e.frameT=Math.random();
    e.x=pts[0][0];e.y=pts[0][1];
  }
  challenge.wave++;
  if(challenge.wave>=5)challenge.spawnedAll=true;
  challenge.waveTimer=0;
}
function challengeWaveDone(w){
  // called when a wave fully resolves (all killed or escaped)
  const killed=enemies.filter(e=>false); // placeholder no-op
}

/* ---------- player ---------- */
function playerHitboxes(){
  if(!player.alive||player.dying>0)return [];
  if(player.dual)return [{x:player.x-9,y:player.y},{x:player.x+9,y:player.y}];
  return [{x:player.x,y:player.y}];
}
function firePlayer(){
  if(!player.alive||player.dying>0||player.respawn>0)return;
  if(pBullets.length>=2)return; // arcade limit: max 2 shots on screen
  const n=player.dual?2:1;
  for(let i=0;i<n&&pBullets.length<2;i++){
    const off=player.dual?(i===0?-9:9):0;
    pBullets.push({x:player.x+off,y:player.y-8});
    shotsFired++;
  }
  sShot();
}
function killPlayer(){
  if(!player.alive||player.dying>0)return;
  const boxes=playerHitboxes();
  explode(boxes[0].x,boxes[0].y,'player');
  sBoom();
  if(player.dual){player.dual=false;explode(boxes[1].x,boxes[1].y,'player');return;} // lose only one half
  player.alive=false;player.dying=1.0;
  lives--;
  if(lives<=0){gameOverTimer=0;state='gameOver';}
}
function respawnCheck(dt){
  if(!player.alive&&player.dying>0){
    player.dying-=dt;
    if(player.dying<=0&&lives>0){player.respawn=1.4;}
  }
  if(player.respawn>0){
    player.respawn-=dt;
    if(player.respawn<=0){player.alive=true;player.x=112;player.invuln=1.2;msg={text:'READY',timer:1.6};}
  }
}

/* ---------- capture / tractor beam ---------- */
function startCapture(boss){
  captive={x:player.x,y:player.y,state:'pull',boss,t:0};
  if(player.dual){player.dual=false;explode(player.x+9,player.y,'player');} // beam takes the extra ship
  sCapture();
  player.alive=false;player.dying=0.001;
  lives--;
  if(lives<=0){gameOverTimer=0;state='gameOver';}
  else player.respawn=1.6;
  beam=null;
}
function endBeam(boss){
  beam=null;
  // beam boss re-enters from the top and returns to its slot
  boss.state='return';
  const s=slotPos(boss.row,boss.col);
  boss.path={p0:[boss.x,boss.y],p1:[boss.x,10],p2:[s.x-20,10],p3:[s.x,s.y]};
  boss.t=0;
}

/* ---------- dives ---------- */
function startDive(e,kind){
  e.state='dive';e.diveKind=kind;e.t=0;
  const side=(e.x<112)?1:-1;
  const speed=1/(2.4-Math.min(1.1,stage*0.09)); // faster dives in later stages
  if(kind==='beam'){
    e.beamTargetY=rand(95,140);
    e.path={p0:[e.x,e.y],p1:[e.x+side*45,e.y-25],p2:[e.x,e.beamTargetY-20],p3:[e.x,e.beamTargetY]};
  }else{
    const p0=[e.x,e.y];
    const p1=[e.x+side*rand(35,60),e.y-25];
    const p2=[clamp(player.x+rand(-70,70),20,GW-20),rand(150,200)];
    const p3=[clamp(player.x+rand(-40,40),10,GW-10),GH+30];
    e.path={p0,p1,p2,p3};
  }
  e.pathRate=speed;
  // escorts for boss dives
  if(e.type==='boss'&&kind==='dive'){
    const goeis=enemies.filter(x=>x.state==='formation'&&x.type==='goei');
    const n=(goeis.length>0&&Math.random()<0.55)?((goeis.length>1&&Math.random()<0.5)?2:1):0;
    e.escorts=[];e.escortsOff=[];
    for(let i=0;i<n;i++){
      const g=goeis[i];g.state='escort';g.followBoss=e;
      const off=(i===0)?[-16,14]:[16,14];
      g.escortOff=off;e.escorts.push(g);
    }
  }
  e.escortsN=(e.escorts?e.escorts.filter(x=>!x.dead).length:0);
}
function returnToFormation(e){
  e.state='return';e.t=0;
  const s=slotPos(e.row,e.col);
  e.path={p0:[clamp(rand(70,154),20,GW-20),-16],p1:[s.x,-10],p2:[s.x,s.y-30],p3:[s.x,s.y]};
  e.pathRate=1/1.8;
}

/* ---------- collision ---------- */
function hitBox(e){
  if(e.type==='boss')return 7,14,12;
  return 5,10,10;
}
function enemyAABB(e){
  const hw=(e.type==='boss')?7:5, hh=(e.type==='boss')?6:5;
  return {x1:e.x-hw,y1:e.y-hh,x2:e.x+hw,y2:e.y+hh};
}
function pointInEnemy(bx,by,e){
  const a=enemyAABB(e);
  return bx>=a.x1&&bx<=a.x2&&by>=a.y1&&by<=a.y2;
}
function damageEnemy(e){
  if(e.type==='boss'&&e.hp>1){e.hp--;sBossHit();return false;}
  // killed
  const pts=pointsFor(e);
  addScore(pts);
  shotsHit++;
  explode(e.x,e.y,'enemy');
  if(e.type==='boss')sBossBoom();else sEnemyHit();
  // captive handling
  if(e.captive&&captive&&captive.boss===e){
    if(e.state==='formation'||e.state==='enter'){
      // captive is destroyed with its boss and does not return
      explode(captive.x,captive.y,'player');captive=null;
    }else{
      // freed: flies down and docks
      captive.state='free';captive.dockT=0;
    }
  }
  // escorts released
  if(e.escorts)e.escorts.forEach(g=>{if(!g.dead&&g.state==='escort')returnToFormation(g);});
  e.dead=true;
  if(state==='challenging'&&e.wave>=0){
    challenge.hits++;
  }
  return true;
}

/* ---------- update ---------- */
function updateEnemies(dt){
  const complete=entryQueue.length===0;
  // formation sway / breathing
  if(complete){
    formation.sway=6*Math.sin(stageTime*0.55);
    formation.breathe=1+0.09*Math.sin(stageTime*0.9);
  }else{
    formation.sway=10*Math.sin(stageTime*0.7);
    formation.breathe=1;
  }
  for(const e of enemies){
    if(e.dead)continue;
    e.frameT+=dt*3.2;e.frame=Math.floor(e.frameT)%2;

    if(e.state==='enter'){
      e.t+=dt*(1/2.3);
      const p=bez(e.path,Math.min(1,e.t));e.x=p[0];e.y=p[1];
      if(e.t>=1)e.state='formation';
      // may fire while entering
      if(e.t>0.35&&Math.random()<0.0035+stage*0.0008&&e.y>20&&e.y<200)enemyFire(e);
    }
    else if(e.state==='formation'){
      const s=slotPos(e.row,e.col);e.x=s.x;e.y=s.y;
    }
    else if(e.state==='dive'){
      e.t+=dt*(e.pathRate||1/2.2);
      const p=bez(e.path,Math.min(1,e.t));e.x=p[0];e.y=p[1];
      e.fireT-=dt;
      if(e.fireT<=0&&e.y>10&&e.y<210){enemyFire(e);e.fireT=rand(0.6,1.8);}
      if(e.diveKind==='beam'&&e.t>=1){
        e.state='beam';beam={boss:e,t:0,dur:4.0};sTractor();
      }else if(e.t>=1||e.y>GH+20){
        returnToFormation(e);
      }
    }
    else if(e.state==='beam'){
      // handled in beam update
    }
    else if(e.state==='return'){
      e.t+=dt*(e.pathRate||1/1.8);
      const p=bez(e.path,Math.min(1,e.t));e.x=p[0];e.y=p[1];
      if(e.t>=1)e.state='formation';
    }
    else if(e.state==='escort'){
      const b=e.followBoss;
      if(!b||b.dead){returnToFormation(e);}
      else{e.x=b.x+e.escortOff[0];e.y=b.y+e.escortOff[1];
        e.fireT-=dt;
        if(e.fireT<=0&&e.y>10&&e.y<210){enemyFire(e);e.fireT=rand(0.8,2.2);}
      }
    }
    else if(e.state==='path'){ // challenging stage
      e.polyD+=dt*115;
      const p=polyPoint(e.poly,e.polyD);
      if(!p){e.dead=true;challenge.waveEscaped=true;challenge.perfect=false;continue;}
      const ang=p[2];
      e.x=p[0]+Math.cos(ang+Math.PI/2)*e.off;
      e.y=p[1]+Math.sin(ang+Math.PI/2)*e.off;
    }
  }
  enemies=enemies.filter(e=>!e.dead);
}
function enemyFire(e){
  const dx=(player.x-e.x)*0.25;
  const sp=105+stage*3;
  const ang=Math.atan2(1,clamp(dx/80,-0.6,0.6));
  eBullets.push({x:e.x,y:e.y+8,vx:Math.cos(ang)*sp*0.35,vy:Math.sin(ang)*sp});
}
function updateBeam(dt,boss){
  beam.t+=dt;
  if(Math.floor(beam.t*3)!==Math.floor((beam.t-dt)*3))sTractor();
  // capture check: cone widening downward
  if(!captive&&player.alive&&player.respawn<=0&&player.dying<=0&&player.invuln<=0){
    const hw=4+(player.y-boss.y)*0.30;
    if(Math.abs(player.x-boss.x)<=hw&&player.y>boss.y){
      startCapture(boss);return;
    }
  }
  if(beam.t>=beam.dur)endBeam(boss);
}
function updateCaptive(dt){
  if(!captive)return;
  const b=captive.boss;
  if(captive.state==='pull'){
    captive.t+=dt;
    const T=Math.min(1,captive.t/1.2);
    const tx=b.x, ty=b.y-16;
    captive.x+=(tx-captive.x)*dt*3;
    captive.y+=(ty-captive.y)*dt*3;
    if(T>=1){captive.state='held';captive.boss.captive=true;}
  }
  else if(captive.state==='held'){
    if(!b||b.dead){captive.state='free';captive.dockT=0;}
    else{
      captive.x=b.x;captive.y=b.y-16;
      // captive fires while its boss dives
      if(b.state==='dive'||b.state==='escort'){
        captive.fireT=(captive.fireT||1)-dt;
        if(captive.fireT<=0){
          eBullets.push({x:captive.x,y:captive.y+8,vx:0,vy:130});
          captive.fireT=rand(0.8,1.6);
        }
      }
    }
  }
  else if(captive.state==='free'){
    captive.dockT+=dt;
    captive.y+=dt*120;
    if(captive.y<10)captive.x+=(player.x-captive.x)*dt*2;
    if(captive.y>=player.y-10){
      if(player.alive&&player.dying<=0&&!player.dual&&captive.dockT<3){
        player.dual=true;captive=null;sDock();
      }else if(captive.dockT>2.5){explode(captive.x,captive.y,'player');captive=null;}
    }
  }
}
function updateDives(dt){
  if(!entryQueue.length&&player.alive&&player.respawn<=0&&player.dying<=0&&state==='play'){
    diveTimer-=dt;
    if(diveTimer<=0){
      const cands=enemies.filter(e=>e.state==='formation');
      if(cands.length){
        const e=cands[(Math.random()*cands.length)|0];
        let kind='dive';
        if(e.type==='boss'&&Math.random()<0.28)kind='beam';
        startDive(e,kind);
        if(stage>=4&&Math.random()<0.3){
          const c2=enemies.filter(x=>x.state==='formation');
          if(c2.length)startDive(c2[(Math.random()*c2.length)|0],'dive');
        }
      }
      diveTimer=Math.max(0.8,3.4-stage*0.28)*rand(0.6,1.4);
    }
  }
}
function updateBullets(dt){
  for(const b of pBullets){b.y-=330*dt;}
  pBullets=pBullets.filter(b=>b.y>-10);
  for(const b of eBullets){b.x+=b.vx*dt;b.y+=b.vy*dt;}
  eBullets=eBullets.filter(b=>b.y<GH+10&&b.x>-10&&b.x<GW+10);

  // player bullets vs enemies / captive boss (captive itself is not shootable)
  for(const b of pBullets){
    for(const e of enemies){
      if(e.dead)continue;
      if(pointInEnemy(b.x,b.y,e)){
        b.dead=true;damageEnemy(e);break;
      }
    }
  }
  pBullets=pBullets.filter(b=>!b.dead);

  // enemy bullets vs player
  if(player.alive&&player.dying<=0&&player.invuln<=0){
    const boxes=playerHitboxes();
    for(const b of eBullets){
      let hit=false;
      for(const bx of boxes){
        if(Math.abs(b.x-bx.x)<=6&&Math.abs(b.y-bx.y)<=7){hit=true;break;}
      }
      if(hit){b.dead=true;killPlayer();break;}
    }
    eBullets=eBullets.filter(b=>!b.dead);
  }
}
function updateRam(dt){
  if(!player.alive||player.dying>0||player.invuln>0)return;
  const boxes=playerHitboxes();
  for(const e of enemies){
    if(e.dead||e.state==='path')continue;
    const a=enemyAABB(e);
    for(const bx of boxes){
      if(bx.x+6>a.x1&&bx.x-6<a.x2&&bx.y+7>a.y1&&bx.y-7<a.y2){
        damageEnemy(e);killPlayer();return;
      }
    }
  }
}
function updateExplosions(dt){
  for(const e of explosions)e.t+=dt;
  explosions=explosions.filter(e=>e.t<(e.kind==='player'?0.75:0.4));
}
function updateChallenge(dt){
  challenge.waveTimer+=dt;
  if(!challenge.spawnedAll&&challenge.waveTimer>5.5)spawnChallengeWave();
  // wave bonus when a wave is fully destroyed
  for(let w=0;w<5;w++){
    if(challenge['b'+w])continue;
    const alive=enemies.filter(e=>e.wave===w);
    const anySpawned=challenge.wave>w||(challenge.wave===w);
    if(!anySpawned)continue;
    if(alive.length===0){
      // all of wave w resolved: killed count = 8 - escaped
      const resolved=challenge['k'+w]||0;
      if(resolved>=8){challenge['b'+w]=true;addScore(1000);msg={text:'WAVE BONUS 1000',timer:1.6};sBonus();}
      else challenge['b'+w]=true; // wave escaped
    }
  }
  if(challenge.spawnedAll&&enemies.length===0){
    challenge.doneTimer+=dt;
    if(challenge.doneTimer>1.2){
      let bonus=0;
      for(let w=0;w<5;w++)if(challenge['b'+w]&&challenge['k'+w]>=8)bonus+=1000;
      if(challenge.perfect&&challenge.hits>=40){bonus+=10000;addScore(10000);}
      challenge.finalBonus=bonus;
      state='results';resultsTimer=0;
    }
  }
}

/* main update dispatcher */
function update(dt){
  updateStars(dt);
  flashT+=dt;
  if(msg){msg.timer-=dt;if(msg.timer<=0)msg=null;}
  if(paused)return;

  if(state==='title'){/* attract handled in render */}
  else if(state==='stageIntro'){
    introTimer-=dt;
    if(introTimer<=0)beginStagePlay();
  }
  else if(state==='play'){
    stageTime+=dt;
    // spawn entry groups
    for(const g of entryQueue){
      if(!g.spawned&&stageTime>=g.start){
        g.spawned=true;
        g.members.forEach((m,i)=>{
          spawnEnemy(m.type,m.row,m.col,entryPath(m.row,m.col,g.side));
          // stagger via negative path time
          const e=enemies[enemies.length-1];
          e.t=-i*0.18;
        });
      }
    }
    entryQueue=entryQueue.filter(g=>!g.spawned||true); // keep for 'complete' check below
    // formation complete when all groups spawned
    const allSpawned=entryQueue.every(g=>g.spawned);
    // (entryQueue empties naturally as enemies reach formation; use allSpawned flag)
    if(allSpawned&&entryQueue.length>0&&!enemies.some(e=>e.state==='enter')){
      entryQueue=[];
    }
    updateEnemies(dt);
    updateBeam2(dt);
    updateCaptive(dt);
    updateDives(dt);
    updateBullets(dt);
    updateRam(dt);
    updateExplosions(dt);
    respawnCheck(dt);
    if(player.invuln>0)player.invuln-=dt;
    // stage complete?
    if(entryQueue.length===0&&enemies.length===0&&!captive){
      stageComplete();
    }
  }
  else if(state==='challenging'){
    stageTime+=dt;
    // assign per-wave kill counts before wave resolution check
    for(const e of enemies){if(e.wave>=0)challenge['k'+e.wave]=(challenge['k'+e.wave]||0);}
    updateEnemiesChallenging(dt);
    updateBulletsChallenging(dt);
    updateExplosions(dt);
    respawnCheck(dt);
    if(player.invuln>0)player.invuln-=dt;
    updateChallenge(dt);
  }
  else if(state==='results'){
    resultsTimer+=dt;updateExplosions(dt);
    if(resultsTimer>4.5)stageComplete();
  }
  else if(state==='gameOver'){
    gameOverTimer+=dt;updateExplosions(dt);
    if(gameOverTimer>7)state='title';
  }
}
function updateBeam2(dt){
  if(beam){
    if(!beam.boss||beam.boss.dead){beam=null;}
    else updateBeam(dt,beam.boss);
  }
}
function updateEnemiesChallenging(dt){
  for(const e of enemies){
    if(e.dead)continue;
    e.frameT+=dt*3.2;e.frame=Math.floor(e.frameT)%2;
    if(e.state==='path'){
      e.polyD+=dt*115;
      const p=polyPoint(e.poly,e.polyD);
      if(!p){e.dead=true;continue;}
      e.x=p[0];e.y=p[1];
    }
  }
  enemies=enemies.filter(e=>!e.dead);
}
function updateBulletsChallenging(dt){
  for(const b of pBullets)b.y-=330*dt;
  pBullets=pBullets.filter(b=>b.y>-10);
  for(const b of pBullets){
    for(const e of enemies){
      if(e.dead)continue;
      if(pointInEnemy(b.x,b.y,e)){
        b.dead=true;
        if(e.type==='boss'&&e.hp>1){e.hp--;sBossHit();}
        else{
          addScore(100);shotsHit++;challenge.hits++;
          challenge['k'+e.wave]=(challenge['k'+e.wave]||0)+1;
          explode(e.x,e.y,'enemy');sEnemyHit();e.dead=true;
        }
        break;
      }
    }
  }
  pBullets=pBullets.filter(b=>!b.dead);
  // challenging stage: enemies never shoot the player
}

/* ---------- rendering ---------- */
function text(s,x,y,color,size,align){
  ctx.font='bold '+(size||8)+'px monospace';
  ctx.textAlign=align||'left';
  ctx.fillStyle=color;
  ctx.fillText(s,x,y);
  ctx.textAlign='left';
}
function drawHUD(){
  text('1UP',12,12,'#66ccff');
  text(String(score),12,22,'#ffffff');
  text('HIGH SCORE',84,12,'#ff4444');
  text(String(high),98,22,'#ffffff');
  // reserve ships bottom-left
  for(let i=0;i<lives-1;i++){
    ctx.save();ctx.translate(10+i*18,262);ctx.scale(0.85,0.85);
    drawSprite(SPR.player,0,0);ctx.restore();
  }
  // stage flags bottom-right (arcade denominations)
  const vals=[1,5,10,20,30,50,70,100,150,200];
  const shown=Math.min(3,stage);
  for(let i=0;i<shown;i++){
    const st=stage-shown+1+i;
    const v=vals[Math.min(st-1,vals.length-1)];
    const x=GW-14-(shown-1-i)*26;
    drawFlag(x,258,v,st===stage);
  }
}
function drawFlag(x,y,val,bright){
  ctx.fillStyle=bright?'#ff2222':'#aa2222';
  ctx.fillRect(x+2,y,1,20);                 // pole
  ctx.beginPath();
  ctx.moveTo(x+3,y+2);ctx.lineTo(x+16,y+5);ctx.lineTo(x+3,y+10);ctx.closePath();
  ctx.fill();                                // flag
  ctx.fillStyle='#ffffff';
  ctx.font='bold 7px monospace';ctx.textAlign='center';
  ctx.fillText(String(val),x+8,y+8);
  ctx.textAlign='left';
}
function drawExplosions(){
  for(const e of explosions){
    const big=e.kind==='player';
    const dur=big?0.75:0.4;
    const f=Math.floor(e.t/dur*8);
    const r=(big?6:4)+f*(big?2.4:1.6);
    const cols=['#ffffff','#ffee44','#ff8822','#ff2222'];
    ctx.strokeStyle=cols[f%cols.length];ctx.lineWidth=1;
    for(let k=0;k<8;k++){
      const a=k*Math.PI/4+f*0.2;
      ctx.beginPath();
      ctx.moveTo(e.x+Math.cos(a)*r*0.35,e.y+Math.sin(a)*r*0.35);
      ctx.lineTo(e.x+Math.cos(a)*r,e.y+Math.sin(a)*r);
      ctx.stroke();
    }
    ctx.fillStyle='#ffffff';
    const cr=Math.max(1,(big?8:5)-f);
    ctx.beginPath();ctx.arc(e.x,e.y,cr,0,6.28);ctx.fill();
  }
}
function drawBeam(){
  if(!beam)return;
  const b=beam.boss;
  ctx.save();
  for(let y=Math.round(b.y+8);y<GH;y+=2){
    const hw=4+(y-b.y)*0.30;
    const flick=0.25+0.2*Math.sin(y*0.7+beam.t*12);
    ctx.fillStyle='rgba(70,110,255,'+flick.toFixed(2)+')';
    ctx.fillRect(Math.round(b.x-hw),y,Math.round(hw*2),2);
    ctx.fillStyle='rgba(140,180,255,'+(flick*0.8).toFixed(2)+')';
    ctx.fillRect(Math.round(b.x-hw),y,1,2);
    ctx.fillRect(Math.round(b.x+hw)-1,y,1,2);
  }
  ctx.restore();
}
function drawPlayer(){
  if(player.alive&&player.dying<=0&&player.respawn<=0){
    if(player.invuln>0&&Math.floor(flashT*10)%2===0)return; // blink while invulnerable
    if(player.dual){drawPlayerShip(player.x-9,player.y);drawPlayerShip(player.x+9,player.y);}
    else drawPlayerShip(player.x,player.y);
  }
}
function drawEnemies(){
  for(const e of enemies)drawEnemy(e);
  // held captive above its boss
  if(captive&&captive.state==='held')drawPlayerShip(captive.x,captive.y,true);
  if(captive&&captive.state==='pull')drawPlayerShip(captive.x,captive.y,true);
  if(captive&&captive.state==='free')drawPlayerShip(captive.x,captive.y,true);
}
function drawBullets(){
  ctx.fillStyle='#88ffff';
  for(const b of pBullets)ctx.fillRect(Math.round(b.x)-1,Math.round(b.y)-4,2,8);
  ctx.fillStyle='#ffaa44';
  for(const b of eBullets)ctx.fillRect(Math.round(b.x)-1,Math.round(b.y)-3,2,6);
}
function drawTitle(){
  text('GALAGA',GW/2,70,'#ffee22',26,'center');
  text('GALAGA',GW/2+1,71,'#ff4422',26,'center');
  text('GALAGA',GW/2,69,'#66ccff',26,'center');
  // sample enemies
  drawSprite(SPR.zako[Math.floor(flashT*3)%2],40,110);
  drawSprite(SPR.goei[Math.floor(flashT*3)%2],104,110);
  drawSprite(SPR.boss[Math.floor(flashT*3)%2],168,110);
  text('ZAKO',20,140,'#66ccff');    text('50',90,140,'#ffffff'); text('100',120,140,'#ffffff');
  text('GOEI',20,158,'#ff4444');    text('80',90,158,'#ffffff'); text('160',120,158,'#ffffff');
  text('BOSS',20,176,'#22cc44');    text('150',90,176,'#ffffff');text('400',120,176,'#ffffff');
  text('GALAGA',20,188,'#22cc44');  text('800',90,188,'#ffffff');text('1600',120,188,'#ffffff');
  text('FORMATION',60,204,'#999999',7,'center');
  text('DIVE',140,204,'#999999',7,'center');
  if(Math.floor(flashT*2)%2===0)
    text('PRESS ENTER TO START',GW/2,240,'#ffffff',10,'center');
  text('SPACE FIRE  ARROWS MOVE  P PAUSE  M MUTE',GW/2,268,'#666688',7,'center');
}
function render(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,GW,GH);
  drawStars();

  if(state==='title'){
    drawTitle();
  }else{
    drawHUD();
    if(state!=='results'&&state!=='gameOver'){
      drawBeam();
      drawEnemies();
      drawPlayer();
      drawBullets();
    }else if(state==='gameOver'){
      drawEnemies();drawBullets();
    }
    drawExplosions();

    if(state==='stageIntro'){
      text(isChallenge(stage)?'CHALLENGING STAGE':'STAGE '+stage,GW/2,150,'#ffffff',12,'center');
    }
    if(state==='challenging'){
      text('CHALLENGING STAGE',GW/2,140,'#ffee22',9,'center');
    }
    if(msg&&Math.floor(flashT*6)%2===0)
      text(msg.text,GW/2,170,'#ffee22',10,'center');
    if(paused)text('PAUSE',GW/2,150,'#ff4444',12,'center');
    if(state==='gameOver'){
      if(gameOverTimer<2.5){
        text('GAME OVER',GW/2,140,'#ff4444',14,'center');
      }else{
        text('GAME OVER',GW/2,110,'#ff4444',12,'center');
        text('SHOTS FIRED = '+shotsFired,GW/2,150,'#ffffff',9,'center');
        text('NUMBER OF HITS = '+shotsHit,GW/2,166,'#ffffff',9,'center');
        const ratio=shotsFired>0?Math.round(shotsHit/shotsFired*100):0;
        text('HIT RATIO = '+ratio+'%',GW/2,182,'#ffee22',9,'center');
      }
    }
    if(state==='results'){
      text('NUMBER OF HITS = '+challenge.hits,GW/2,140,'#ffffff',10,'center');
      text('BONUS = '+challenge.finalBonus,GW/2,160,'#ffee22',10,'center');
    }
  }

  // blit scaled to display canvas
  vctx.imageSmoothingEnabled=false;
  vctx.clearRect(0,0,view.width,view.height);
  vctx.drawImage(cv,0,0,GW,GH,0,0,view.width,view.height);
}

/* ---------- input ---------- */
window.addEventListener('keydown',e=>{
  initAudio();
  if(AC&&AC.state==='suspended')AC.resume();
  const k=e.key;
  if([' ','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(k))e.preventDefault();
  keys[k]=true;
  if(k==='Enter'){
    if(state==='title')startGame();
  }
  if(k===' '){fireEdge=true;}
  if(k==='p'||k==='P'){
    if(state==='play'||state==='challenging')paused=!paused;
  }
  if(k==='m'||k==='M'){muted=!muted;}
});
window.addEventListener('keyup',e=>{keys[e.key]=false;});

/* player movement in fixed update */
function updatePlayer(dt){
  if(state==='play'||state==='challenging'){
    if(player.alive&&player.dying<=0&&player.respawn<=0&&!paused){
      const sp=115;
      if(keys['ArrowLeft']||keys['a']||keys['A'])player.x-=sp*dt;
      if(keys['ArrowRight']||keys['d']||keys['D'])player.x+=sp*dt;
      player.x=clamp(player.x,12,GW-12);
      if(fireEdge)firePlayer();
    }
  }
  fireEdge=false;
}

/* ---------- fixed-timestep main loop ---------- */
let lastT=performance.now(),acc=0;
const DT=1/60;
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-lastT)/1000;lastT=now;
  if(dt>0.1)dt=0.1;
  acc+=dt;
  while(acc>=DT){
    updatePlayer(DT);
    update(DT);
    acc-=DT;
  }
  render();
}
requestAnimationFrame(frame);
</script>
