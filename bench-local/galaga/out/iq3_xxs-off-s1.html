"use strict";
/* =====================================================================
   GALAGA — faithful browser clone (single file, no external resources)
   All graphics are drawn in code; all sound is synthesized with Web Audio.
   ===================================================================== */

/* ---------- canvas & scaling ---------- */
const GAME_W=224, GAME_H=288;
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const scale=Math.max(1,Math.floor(Math.min(window.innerHeight/GAME_H, window.innerWidth/GAME_W)));
canvas.width=GAME_W*scale; canvas.height=GAME_H*scale;
ctx.setTransform(scale,0,0,scale,0,0);
function resize(){const s=Math.max(1,Math.floor(Math.min(window.innerHeight/GAME_H, window.innerWidth/GAME_W)));
  canvas.width=GAME_W*s; canvas.height=GAME_H*s; ctx.setTransform(s,0,0,s,0,0);}
window.addEventListener('resize',resize);

/* ---------- palette ---------- */
const PAL={
  WHITE:'#ffffff',RED:'#ff2a2a',ORANGE:'#ff8a1e',YELLOW:'#ffe14d',GREEN:'#37e37a',
  BLUE:'#3a86ff',CYAN:'#39d7ff',MAGENTA:'#ff3fbf',PURPLE:'#a45bff',
  GOEI:'#ff4a2a',ZAKO:'#2f7bff',ZAKO2:'#ffd23f',BOSSG:'#33e07a',BOSSB:'#7a4bff'

/* ---------- small math helpers ---------- */
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function sign(v){return v<0?-1:1;}
function lerp(a,b,t){return a+(b-a)*t;}
function catmull(p0,p1,p2,p3,t){const t2=t*t,t3=t2*t;
  return 0.5*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t2+(-p0+3*p1-3*p2+p3)*t3);}

/* ---------- audio (Web Audio, synthesized) ---------- */
let AC=null,muted=false;
function ensureAudio(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume(); }
function env(g,t,a,d,p){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(p,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);}
function tone(f,dur,type,vol,f2,delay){ if(!AC||muted)return; const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain(); o.type=type||'square'; o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur); env(g,t,0.005,dur,vol||0.15);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur+0.05); }
function noise(dur,vol,freq,delay){ if(!AC||muted)return; const t=AC.currentTime+(delay||0);
  const b=AC.createBuffer(1,Math.max(1,(AC.sampleRate*dur)|0),AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const s=AC.createBufferSource();s.buffer=b; const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq||3000;
  const g=AC.createGain();env(g,t,0.005,dur,vol||0.2); s.connect(f).connect(g).connect(AC.destination); s.start(t); }
function sfx(name){ if(!AC||muted)return; switch(name){
  case 'shoot': tone(900,0.08,'square',0.10,260); break;
  case 'ehit': tone(520,0.05,'square',0.09,300); break;
  case 'edie': noise(0.16,0.20,1800); tone(320,0.14,'sawtooth',0.08,80); break;
  case 'boss': tone(140,0.18,'sawtooth',0.14,60); break;
  case 'boom': noise(0.45,0.30,1200); tone(160,0.4,'sawtooth',0.14,40); break;
  case 'beam': tone(500,0.5,'sine',0.06,180); tone(700,0.5,'sine',0.04,220,0.05); break;
  case 'start': [523,659,784,1046].forEach((f,i)=>tone(f,0.14,'square',0.11,0,i*0.11)); break;
  case 'extra': [1046,1318,1568].forEach((f,i)=>tone(f,0.12,'square',0.11,0,i*0.08)); break;
  case 'over': [392,330,262,196].forEach((f,i)=>tone(f,0.22,'square',0.11,0,i*0.18)); break;
  case 'free': tone(660,0.12,'square',0.11,990); break;
  case 'dock': [660,990].forEach((f,i)=>tone(f,0.12,'square',0.11,0,i*0.09)); break;
  case 'chall': [784,988,1175,1568].forEach((f,i)=>tone(f,0.13,'square',0.11,0,i*0.1)); break;
  case 'perfect': [1046,1318,1568,2093,2637].forEach((f,i)=>tone(f,0.13,'square',0.12,0,i*0.09)); break;
}}

/* ---------- pixel-art sprite helpers ---------- */
function makeSprite(rows,pal){ const h=rows.length,w=rows[0].length; const c=document.createElement('canvas');
  c.width=w;c.height=h; const x=c.getContext('2d'); for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){const k=rows[y][xx];
  if(k==='.'||k===' ')continue; x.fillStyle=pal[k]; x.fillRect(xx,y,1,1);} return c;}
function drawSprite(sp,x,y){ ctx.drawImage(sp,Math.round(x),Math.round(y)); }
